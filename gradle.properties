# JVM args for Gradle (cloud VMs have plenty of RAM; kept modest anyway)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX is required for Compose
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Smaller R classes = faster builds
android.nonTransitiveRClass=true
